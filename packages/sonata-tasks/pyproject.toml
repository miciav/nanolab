[project]
name = "sonata-tasks"
version = "0.1.0"
description = "nanoFaaS workflow tasks built on the Sonata engine."
requires-python = ">=3.12"
dependencies = [
    "azure-vm-sdk @ git+https://github.com/miciav/azure-vm-sdk.git@cb159a5",
    "httpx>=0.27",
    "multipass-sdk @ git+https://github.com/miciav/multipass-sdk.git@402c406",
    "proxmox-sdk @ git+https://github.com/miciav/proxmox-sdk.git@9e20703",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5",
    "shellcraft @ git+https://github.com/miciav/shellcraft.git@b6547835aac88d058810c7b9a592ad442c54ac99",
    # Keep this commit equal to [tool.uv.sources] in the root pyproject. Inside
    # the workspace the root's pin wins, so a stale one here goes unnoticed
    # until the built wheel is installed on its own — which is how this package
    # ended up importing WorkflowCompletion from an engine that predates it.
    "sonata-engine @ git+https://github.com/miciav/sonata.git@e81d559952d4a168edffbe3c7108bd9a017046e9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonata_tasks = [
    "py.typed",
    "infra/ansible_assets/ansible.cfg",
    "infra/ansible_assets/requirements.txt",
    "infra/ansible_assets/playbooks/*.yml",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "grimp>=3.14",
    "import-linter>=2.11",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sonata_tasks --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "SLF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F841", "SLF001"]

[tool.basedpyright]
include = ["src/sonata_tasks", "tests"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateUsage = false
