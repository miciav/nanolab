[project]
name = "sonata-tasks"
version = "0.1.0"
description = "nanoFaaS workflow tasks built on the Sonata engine."
requires-python = ">=3.12"
dependencies = [
    "sonata-engine @ git+https://github.com/miciav/sonata.git@0bafb9ab3778b54ca3f08a75c1f3ccd0ed3e017b",
    "workflow-tasks",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonata_tasks = ["py.typed"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "grimp>=3.14",
    "import-linter>=2.11",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.12",
]

[tool.uv.sources]
workflow-tasks = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sonata_tasks --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "SLF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F841", "SLF001"]

[tool.basedpyright]
include = ["src/sonata_tasks"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateUsage = false
