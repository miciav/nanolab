[project]
name = "nanolab"
version = "0.1.0"
description = "Control-plane orchestration product for build, test, and reporting"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.5",
    "questionary>=2.1.1",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "rich>=13.8",
    "sonata-engine",
    "sonata-tasks",
    "tui-toolkit",
]

[project.scripts]
nanolab = "nanolab.app.main:main"
nanolab-package-report = "nanolab.devtools.package_report:main"
nanolab-quality = "nanolab.devtools.quality:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "grimp>=3.14",
    "import-linter>=2.11",
    "pydeps>=3.0.6",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv.sources]
sonata-tasks = { git = "https://github.com/miciav/sonata.git", rev = "d1001e1", subdirectory = "packages/sonata-tasks" }
tui-toolkit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "SLF"]

[tool.ruff.lint.per-file-ignores]
"src/nanolab/tui/app.py" = ["SLF001"]
"tests/**/*.py" = ["F841", "SLF001"]

[tool.basedpyright]
include = [
    "src/nanolab",
    "tests",
]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateUsage = false
