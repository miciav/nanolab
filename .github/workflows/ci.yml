name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      NANOFAAS_ROOT: ${{ github.workspace }}/.nanofaas-source

    steps:
      - name: Check out nanolab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out pinned nanoFaaS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: miciav/nanofaas
          # nanofaas main at "Prepare release v0.17.1". Carries the
          # deploymentObjects field the control plane now reports, and the 0.17.1
          # version bump — which the release tests read rather than assume.
          ref: ef80fd3b67e9f858f18e1868955ac8931ad43c03
          path: .nanofaas-source
          token: ${{ secrets.NANOFAAS_CHECKOUT_TOKEN }}

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lock and sync workspace
        run: |
          uv lock --check
          uv sync --locked --all-packages --all-groups

      - name: Run nanolab tests
        run: uv run --locked --all-packages --all-groups pytest -c packages/nanolab/pyproject.toml packages/nanolab/tests

      - name: Run workflow-tasks tests
        run: uv run --locked --all-packages --all-groups pytest -c packages/workflow-tasks/pyproject.toml packages/workflow-tasks/tests

      - name: Run sonata-tasks tests
        run: uv run --locked --all-packages --all-groups pytest -c packages/sonata-tasks/pyproject.toml packages/sonata-tasks/tests

      - name: Run tui-toolkit tests
        run: uv run --locked --all-packages --all-groups pytest -c packages/tui-toolkit/pyproject.toml packages/tui-toolkit/tests

      - name: Run static checks
        run: |
          uv run --locked --all-packages --all-groups ruff check packages
          uv run --locked --all-packages --all-groups basedpyright --project packages/nanolab
          uv run --locked --all-packages --all-groups basedpyright --project packages/workflow-tasks
          uv run --locked --all-packages --all-groups basedpyright --project packages/sonata-tasks
          uv run --locked --all-packages --all-groups basedpyright --project packages/tui-toolkit

      - name: Run import contracts
        run: |
          uv run --locked --all-packages --all-groups lint-imports --config packages/nanolab/.importlinter --no-cache
          uv run --locked --all-packages --all-groups lint-imports --config packages/workflow-tasks/.importlinter --no-cache
          uv run --locked --all-packages --all-groups lint-imports --config packages/sonata-tasks/.importlinter --no-cache
          uv run --locked --all-packages --all-groups lint-imports --config packages/tui-toolkit/.importlinter --no-cache

      - name: Build distributions
        # No --clear: the runner checks out fresh, so there is nothing to clear,
        # and clearing races with the .gitignore uv keeps in the output directory
        # while four packages build into it. That race failed one run of PR #3
        # with "failed to open file dist/.gitignore" after every package had
        # already built successfully.
        run: uv build --all-packages --out-dir dist

      - name: Smoke-test installed wheels
        run: |
          uv venv .wheel-smoke
          uv pip install dist/nanolab-0.1.0-py3-none-any.whl dist/sonata_tasks-0.1.0-py3-none-any.whl dist/workflow_tasks-0.1.0-py3-none-any.whl dist/tui_toolkit-0.1.0-py3-none-any.whl --python .wheel-smoke/bin/python
          .wheel-smoke/bin/python -c "import nanolab, sonata_tasks, workflow_tasks, tui_toolkit"
          .wheel-smoke/bin/nanolab --help

      - name: Generate representative plans
        run: |
          set -euo pipefail
          uv run --package nanolab nanolab plan packages/nanolab/scenarios-v2/validate-container.yaml --environment packages/nanolab/environments/local.yaml
          uv run --package nanolab nanolab plan packages/nanolab/scenarios-v2/validate-k8s.yaml --environment packages/nanolab/environments/multipass.yaml
          uv run --package nanolab nanolab plan packages/nanolab/scenarios-v2/cli-k8s.yaml --control-plane-url http://control-plane.example:30080
          uv run --package nanolab nanolab plan packages/nanolab/scenarios-v2/cli-container.yaml | grep -q '010.release-local-control-plane'
          provisioned_plan="$(mktemp)"
          trap 'rm -f "$provisioned_plan"' EXIT
          uv run --package nanolab nanolab plan packages/nanolab/scenarios-v2/cli-k8s.yaml \
            --environment packages/nanolab/environments/multipass.yaml \
            --provision >"$provisioned_plan"
          grep -Fq '002.acquire-stack-vm' "$provisioned_plan"
          grep -Fq '006.acquire-control-plane-helm-release' "$provisioned_plan"
          grep -Fq '012.release-stack-vm' "$provisioned_plan"
          # Images come from GHCR; a registry step here means the legacy bootstrap
          # sequence was reused wholesale again.
          ! grep -Fq 'registry' "$provisioned_plan"

      - name: Run cli-container smoke test
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if curl -sS -m 2 http://127.0.0.1:18080/v1/functions >/dev/null 2>&1; then
            echo "API port 18080 is already in use" >&2
            exit 1
          fi
          if curl -sS -m 2 http://127.0.0.1:18081/actuator/health >/dev/null 2>&1; then
            echo "Management port 18081 is already in use" >&2
            exit 1
          fi
          uv run --locked --package nanolab \
            nanolab run packages/nanolab/scenarios-v2/cli-container.yaml
          if curl -sS -m 2 http://127.0.0.1:18080/v1/functions >/dev/null 2>&1; then
            echo "API port 18080 remained open after cleanup" >&2
            exit 1
          fi
          if curl -sS -m 2 http://127.0.0.1:18081/actuator/health >/dev/null 2>&1; then
            echo "Management port 18081 remained open after cleanup" >&2
            exit 1
          fi
          remaining="$(docker ps --filter "name=nanofaas-" --format '{{.Names}}')"
          test -z "$remaining"
