[project]
name = "nanolab-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.sources]
sonata-engine = { path = "../sonata", editable = true }

[tool.uv.workspace]
members = [
    "packages/nanolab",
    "packages/sonata-tasks",
    "packages/workflow-tasks",
    "packages/tui-toolkit",
]
