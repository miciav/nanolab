[project]
name = "nanolab-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "sonata-engine",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/nanolab",
    "packages/sonata-tasks",
    "packages/tui-toolkit",
]

[tool.uv.sources]
sonata-engine = { git = "https://github.com/miciav/sonata.git", rev = "e81d559" }
