[project]
name = "nanolab-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "sonata-engine",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/nanolab",
    "packages/sonata-tasks",
    "packages/workflow-tasks",
    "packages/tui-toolkit",
]

[tool.uv.sources]
sonata-engine = { git = "https://github.com/miciav/sonata.git", rev = "cd6fcff25da7e3644137d5cecd239cb3417518b2" }
